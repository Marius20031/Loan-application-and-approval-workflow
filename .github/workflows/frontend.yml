name: Frontend CI

on:
  push:
    branches: [ "main" ]
    paths: [ "frontend/**", ".github/workflows/frontend.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "frontend/**", ".github/workflows/frontend.yml" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend

    steps:
    - uses: actions/checkout@v4
    - name: Set up Node 24
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    # Compiles the app and runs all unit tests
    - name: Build and test
      run: |
        npm run build
        npm test -- --watch=false
